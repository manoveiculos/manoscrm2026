<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C0C0F">
  <title>Manos CRM — sem internet</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0C0C0F; color: #e5e5e5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 0; font-size: 20px; color: #fff; }
    p { margin: 0; max-width: 320px; font-size: 14px; line-height: 1.5; color: #a3a3a3; }
    button { margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #dc2626; color: #fff; font-size: 15px; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Manos CRM">
    <h1>Sem internet agora</h1>
    <p>A Minha Fila precisa de conexão para mostrar os seus leads. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
